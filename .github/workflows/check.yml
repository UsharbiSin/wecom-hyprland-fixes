name: 质量检查
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
jobs:
  quality:
    name: 质量检查
    runs-on: ubuntu-24.04
    steps:
      - name: 获取源码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: 检查分支、提交与 PR 格式
        if: github.event_name == 'pull_request'
        run: python3 tools/check-contribution.py "$GITHUB_EVENT_PATH"
      - name: 检查格式、脚本和单元测试
        run: python3 tools/check.py
